<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Redirecting — Alifeo</title>
  <script>
    (function() {
      var p = window.location.pathname.replace(/\/+$/, "");
      if (p.endsWith("/privacy-policy") || p === "/privacy-policy" || p.endsWith("/privacy") || p === "/privacy") {
        window.location.replace("/privacy-policy/");
      } else if (p.endsWith("/my-account/wpf-delete-account") || p === "/my-account/wpf-delete-account" || p.endsWith("/wpf-delete-account") || p.endsWith("/delete-account") || p === "/delete-account") {
        window.location.replace("/my-account/wpf-delete-account/");
      } else if (p.endsWith("/my-account/orders") || p === "/my-account/orders") {
        window.location.replace("/myorders.html");
      } else if (p.endsWith("/myorders") || p === "/myorders") {
        window.location.replace("/myorders.html");
      } else if (p.endsWith("/cart") || p === "/cart") {
        window.location.replace("/cart.html");
      } else if (p.endsWith("/search") || p === "/search") {
        window.location.replace("/search.html");
      } else {
        window.location.replace("/index.html");
      }
    })();
  </script>
</head>
<body>
  <p>Redirecting to <a href="/myorders.html">My Orders</a>...</p>
</body>
</html>
